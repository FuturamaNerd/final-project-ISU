<!DOCTYPE html>
<html>
<head>
    <title>Map Test</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
    <style>
        #map { height: 500px; width: 100%; }
    </style>
</head>
<body>
    <h1>Map Debug Test</h1>
    <div id="map"></div>
    
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
    <script src="static/news_event.js"></script>
    <script>
        console.log('=== MAP DEBUG TEST ===');
        
        // Test 1: Check if classes are loaded
        console.log('1. Testing classes:');
        console.log('NewsEvent:', typeof NewsEvent);
        console.log('GDELTEvent:', typeof GDELTEvent);
        console.log('NewsAPIEvent:', typeof NewsAPIEvent);
        
        // Test 2: Create map
        console.log('2. Creating map...');
        var map = L.map('map').setView([20, 0], 2);
        
        L.tileLayer('https://api.maptiler.com/maps/streets/{z}/{x}/{y}.png?key=CL4gV9lIzFFudXxk1UwL', {
            tileSize: 512,
            zoomOffset: -1,
            attribution: '&copy; <a href="https://www.maptiler.com/">MapTiler</a> contributors'
        }).addTo(map);
        
        // Test 3: Add a test marker
        console.log('3. Adding test marker...');
        var testMarker = L.marker([40, -100]).addTo(map);
        testMarker.bindPopup('Test marker - if you see this, map is working!');
        
        // Test 4: Test API endpoint
        console.log('4. Testing API endpoint...');
        fetch('/api/events/all')
            .then(response => response.json())
            .then(data => {
                console.log('API Response:', data);
                
                if (data.success && data.events.length > 0) {
                    console.log('5. Testing first event...');
                    const firstEvent = data.events[0];
                    console.log('First event:', firstEvent);
                    
                    // Test creating event object
                    if (firstEvent.data_source === 'gdelt') {
                        const event = GDELTEvent.fromSQLiteData(firstEvent);
                        console.log('Created GDELT event:', event);
                        console.log('Coordinates:', event.getMapCoordinates());
                        
                        // Add marker for first event
                        const coords = event.getMapCoordinates();
                        if (coords && coords.length === 2) {
                            const marker = L.marker(coords).addTo(map);
                            marker.bindPopup(`GDELT: ${event.title}`);
                            console.log('Added GDELT marker at:', coords);
                        }
                    } else {
                        const event = new NewsAPIEvent(firstEvent);
                        console.log('Created NewsAPI event:', event);
                        console.log('Coordinates:', event.getMapCoordinates());
                        
                        // Add marker for first event
                        const coords = event.getMapCoordinates();
                        if (coords && coords.length === 2) {
                            const marker = L.circleMarker(coords, {
                                radius: 8,
                                fillColor: '#007bff',
                                color: '#0056b3',
                                weight: 2,
                                opacity: 0.8,
                                fillOpacity: 0.6
                            }).addTo(map);
                            marker.bindPopup(`NewsAPI: ${event.title}`);
                            console.log('Added NewsAPI marker at:', coords);
                        }
                    }
                }
            })
            .catch(error => {
                console.error('API Error:', error);
            });
    </script>
</body>
</html>
