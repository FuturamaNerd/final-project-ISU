<!DOCTYPE html>
<html>
  <head>
    <title>sandbox</title>
    <meta charset="utf-8" />
    <!--leaflet-->
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        crossorigin=""
    />
    <!--bootstrap-->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" 
integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
  <link rel="stylesheet" 
  href="{{ url_for('static', filename='styles.css') }}">
  </head>
 
  <div id="map-wrapper">
  <div id="map"></div>
    </div>
  <body class="bg-primary">
   <div class="container mt-4"> 
    <div class="d-flex flex-wrap justify-content-around gap-4">
      {% for story in news_stories %}
      <div class="text-center {{ get_continent_style(story.continent) }}">
        <h2 class="text-white">{{ story.continent }}</h2>
        <div class="card">
          <div class="card-body">
            <h5 class="card-title">{{ story.title }}</h5>
            <p class="card-text">{{ story.country }}</p>
            <a href="{{ story.url }}" class="btn btn-primary" target="_blank">Read More</a>
          </div>
        </div>
      </div>
      {% endfor %}
    </div>
</div>

    <script
        src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        crossorigin=""
    ></script>
    <script>
       var map = L.map('map').setView([20, 0], 1); //world map

        L.tileLayer('https://api.maptiler.com/maps/streets/{z}/{x}/{y}.png?key=CL4gV9lIzFFudXxk1UwL', {
            tileSize: 512,
            zoomOffset: -1,
            attribution: '&copy; <a href="https://www.maptiler.com/">MapTiler</a> contributors'
        }).addTo(map);
    </script>
   <script src="{{ url_for('static', filename='script.js') }}"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"
 integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO" crossorigin="anonymous"></script>
  </body>
</html>
