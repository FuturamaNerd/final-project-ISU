<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{{ continent }} News</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="container py-4">
    <h1 class="text-center mb-4 {{ get_continent_style(continent) }}">{{ continent }} News</h1>
    <div class="row row-cols-1 row-cols-md-3 g-4">
      {% for story in news_stories %}
      <div class="col">
        <div class="card h-100">
          <div class="card-body">
            <h5 class="card-title">{{ story.title }}</h5>
            <p class="card-text">
              <strong>Country:</strong> {{ story.country }}<br>
              <strong>Continent:</strong> {{ story.continent }}<br>
              <strong>Domain:</strong> {{ story.domain }}<br>
              <strong>Language:</strong> {{ story.language }}<br>
              <strong>Date:</strong> {{ story.seen_date }}
            </p>
            <a href="{{ story.url }}" class="btn btn-primary" target="_blank">Read More</a>
          </div>
        </div>
      </div>
      {% endfor %}
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
